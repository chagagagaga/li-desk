<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>LinkedIn Desk</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f4f2ee; --card: #ffffff; --ink: #191919; --mute: #666666; --line: #e0dfdc; --blue: #0a66c2; --blue2: #e8f1fb;
  --green: #057642; --green2: #e6f4ea; --red: #b24020; --red2: #fbe9e4; --amber: #915907; --amber2: #fdf3dc; --chip: #eef0f3;
  --shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 3px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000000; --card: #1b1f23; --ink: #e9e9e9; --mute: #a0a4a8; --line: #2f3439; --blue: #71b7fb; --blue2: #12304d;
    --green: #6fcf97; --green2: #12321f; --red: #f28b6c; --red2: #3a1d14; --amber: #f2c46d; --amber2: #3a2c0e; --chip: #2a2f34;
    --shadow: 0 0 0 1px rgba(255,255,255,.08); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.42 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-bottom: 90px; }
a { color: var(--blue); }
header { position: sticky; top: 0; z-index: 5; background: var(--card); box-shadow: var(--shadow); padding: calc(env(safe-area-inset-top) + 8px) 12px 0; }
.top { display: flex; align-items: center; gap: 8px; }
.logo { width: 28px; height: 28px; border-radius: 5px; background: var(--blue); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 15px; }
@media (prefers-color-scheme: dark) { .logo { color: #000; } }
.top h1 { font-size: 17px; margin: 0; flex: 1; }
#upd { font-size: 12px; color: var(--mute); }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 5px; vertical-align: 1px; }
.ibtn { border: 0; background: var(--chip); color: var(--ink); border-radius: 16px; min-width: 34px; height: 30px; font-size: 15px; }
#tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--mute); border-radius: 16px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.tab.on { background: var(--green); border-color: var(--green); color: #fff; }
@media (prefers-color-scheme: dark) { .tab.on { color: #000; } }
.tab .n { font-weight: 400; opacity: .8; margin-left: 3px; }
main { max-width: 640px; margin: 0 auto; padding: 10px 8px; }
#lock { text-align: center; color: var(--mute); padding: 60px 20px; }
.empty { text-align: center; color: var(--mute); padding: 40px 16px; }
.sec { font-size: 13px; color: var(--mute); margin: 16px 6px 6px; text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); margin: 0 0 12px; overflow: hidden; }
.row { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); margin: 0 0 8px; padding: 10px 12px; display: block; cursor: pointer; }
.row .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .m { font-size: 13px; color: var(--mute); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
/* LinkedIn feed post */
.li { padding: 12px 16px 4px; }
.li-h { display: flex; gap: 8px; align-items: flex-start; }
.av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.pid { font-weight: 700; color: #0a66c2; margin-right: 4px; }
.av { overflow: hidden; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #0a66c2, #5aa0e6); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.who b { display: block; font-size: 14px; }
.who span { display: block; font-size: 12px; color: var(--mute); line-height: 1.3; }
.li-t { white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.43; margin: 10px 0 8px; }
.more { color: var(--mute); cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.more:hover { color: var(--blue); text-decoration: underline; }
.media { position: relative; background: var(--chip); }
.media img { display: block; width: 100%; height: auto; }
.car { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car > div { flex: none; width: 100%; scroll-snap-align: start; min-height: 120px; display: grid; place-items: center; color: var(--mute); font-size: 13px; }
.cnt { position: absolute; right: 10px; top: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.li-bar { display: flex; justify-content: space-around; border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 0; color: var(--mute); font-size: 13px; font-weight: 600; }
/* meta */
.meta { padding: 10px 16px 14px; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.chip { background: var(--chip); border-radius: 12px; padding: 2px 9px; font-size: 12px; color: var(--ink); }
.chip.st-pending, .chip.st-failed { background: var(--amber2); color: var(--amber); }
.chip.st-approved, .chip.st-scheduled { background: var(--blue2); color: var(--blue); }
.chip.st-published { background: var(--green2); color: var(--green); }
.chip.st-trash, .chip.st-rejected { background: var(--red2); color: var(--red); }
.chip.pend { background: var(--blue); color: #fff; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lang button { border: 0; background: none; color: var(--mute); padding: 3px 12px; font-size: 13px; font-weight: 600; }
.lang button.on { background: var(--blue); color: #fff; }
@media (prefers-color-scheme: dark) { .lang button.on { color: #000; } }
.kv { font-size: 13px; color: var(--mute); margin: 6px 0; }
.kv b { color: var(--ink); font-weight: 600; }
.sc { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
.sc div { background: var(--chip); border-radius: 8px; text-align: center; padding: 6px 2px; font-size: 11px; color: var(--mute); }
.sc div b { display: block; font-size: 16px; color: var(--ink); }
.sc .avg { background: var(--blue2); }
.sc .avg b { color: var(--blue); }
ul.notes { margin: 6px 0; padding-left: 18px; font-size: 13px; }
details { margin: 6px 0; font-size: 13px; }
summary { cursor: pointer; color: var(--mute); }
.hist div { color: var(--mute); padding: 2px 0; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
.b { border: 1px solid var(--blue); background: var(--card); color: var(--blue); border-radius: 18px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
.b.pri { background: var(--blue); color: #fff; }
@media (prefers-color-scheme: dark) { .b.pri { color: #000; } }
.b.red { border-color: var(--red); color: var(--red); }
.b.gray { border-color: var(--line); color: var(--mute); }
.b:disabled { opacity: .5; }
.metr { display: flex; gap: 14px; font-size: 13px; color: var(--mute); margin-top: 4px; }
.metr b { color: var(--ink); }
/* calendar */
.cal-h { display: flex; align-items: center; gap: 8px; margin: 2px 4px 10px; }
.cal-h .sp { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; }
.grid .wd { text-align: center; font-size: 11px; color: var(--mute); padding-bottom: 2px; }
.day { min-height: 54px; border-radius: 8px; padding: 4px; font-size: 12px; color: var(--mute); position: relative; border: 1px solid transparent; }
.day.out { opacity: .35; }
.day.today { border-color: var(--blue); }
.day.sel { background: var(--blue2); }
.day .d { font-weight: 600; color: var(--ink); }
.dot { display: block; margin-top: 3px; height: 16px; border-radius: 4px; font-size: 10px; line-height: 16px; text-align: center; overflow: hidden; white-space: nowrap; }
.dot.free { border: 1.5px dashed var(--amber); color: var(--amber); background: var(--amber2); line-height: 13px; }
.dot.busy { background: var(--blue); color: #fff; }
.dot.done { background: var(--green); color: #fff; }
.dot.wait { background: var(--chip); color: var(--ink); }
@media (prefers-color-scheme: dark) { .dot.busy, .dot.done { color: #000; } }
.slot { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); margin: 0 0 8px; padding: 10px 12px; cursor: pointer; }
.slot .w { width: 74px; flex: none; font-size: 13px; color: var(--mute); }
.slot .w b { display: block; color: var(--ink); font-size: 14px; }
.slot .x { flex: 1; min-width: 0; }
.slot .x .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.free { background: var(--amber2); box-shadow: none; border: 1.5px dashed var(--amber); cursor: default; }
.slot.free .x { color: var(--amber); font-weight: 600; }
.slot.past { opacity: .6; }
/* today */
.brief { white-space: pre-wrap; padding: 14px 16px; font-size: 14px; }
.ck { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.ck .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--mute); flex: none; display: grid; place-items: center; color: #fff; font-size: 14px; }
.ck.done .box { background: var(--green); border-color: var(--green); }
.ck.done .tx { color: var(--mute); text-decoration: line-through; }
.ck.pend .box { border-style: dashed; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; padding: 12px 16px; }
.stats div { background: var(--chip); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--mute); }
.stats div b { display: block; color: var(--ink); font-size: 16px; }
/* sheet, form, toast */
#sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; transform: translateX(100%); transition: transform .2s; -webkit-overflow-scrolling: touch; }
#sheet.on { transform: none; }
.sh-h { position: sticky; top: 0; z-index: 2; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; }
.sh-h b { flex: 1; font-size: 15px; }
#detail { max-width: 640px; margin: 0 auto; padding: 10px 8px 100px; }
#form { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
#form.on { display: flex; }
.fbox { background: var(--card); width: 100%; max-width: 640px; border-radius: 14px 14px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
.fbox h3 { margin: 0 0 6px; font-size: 16px; }
.fbox p { margin: 0 0 10px; font-size: 13px; color: var(--mute); }
.fbox textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; background: var(--bg); color: var(--ink); resize: vertical; }
.fbox .fa { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
#idea { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 10; border: 0; background: var(--blue); color: #fff; border-radius: 26px; padding: 12px 18px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
@media (prefers-color-scheme: dark) { #idea { color: #000; } }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; z-index: 50; background: #191919; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; pointer-events: none; }
#toast.on { opacity: 1; transform: translateX(-50%); }
@media (prefers-color-scheme: dark) { #toast { background: #e9e9e9; color: #000; } }
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">in</div><h1>LinkedIn Desk</h1><span id="upd"></span><button class="ibtn" id="rf" title="Обновить">⟳</button></div>
  <div id="tabs"></div>
</header>
<main id="list"><div id="lock">Загружаю…</div></main>
<div id="sheet"><div class="sh-h"><button class="ibtn" id="back">‹</button><b id="shT"></b></div><div id="detail"></div></div>
<div id="form"><div class="fbox"><h3 id="fT"></h3><p id="fP"></p><textarea id="txt"></textarea>
  <div class="fa"><button class="b gray" id="fC">Отмена</button><button class="b pri" id="fS">Отправить</button></div></div></div>
<button id="idea">💡 Идея</button>
<div id="toast"></div>
<script>
const APP_VER = "2026-10-29-a";  // bump on every change: an old cached copy (Telegram) reloads itself
const REPO = "chagagagaga/li-desk";
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.platform && Telegram.WebApp.platform !== "unknown" ? Telegram.WebApp : null;
const KB = TG && !TG.initData;  // opened from a keyboard button: sendData works only there
if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
const qs = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.slice(1));
let K = qs.get("k") || hs.get("k");
try { if (K) localStorage.setItem("lik", K); else K = localStorage.getItem("lik"); } catch (e) {}

let PILLARS = { p1: "Что цепляет не-космического покупателя", p2: "От interesting до контракта", p3: "Разборы: Would a lender buy this?",
  p4: "Путь: из e-commerce в космос" };  // the payload's «pillars» / «kinds» (engine core.py) take over when present
let KINDS = { story: "История с цифрами", list: "Подборка / список", data: "Разбор данных", teardown: "Разбор компании",
  framework: "Фреймворк (плохой совет → как правильно)", opinion: "Спорное мнение", news: "Новость + вывод", lessons: "Уроки известного человека" };
const STATUS = { review: "Агенты проверяют", reviewed: "Готовлю картинку", held: "Не прошёл проверку", pending: "Ждёт тебя", reserve: "Резерв", editing: "Правлю", approved: "Одобрен", scheduled: "Запланирован", published: "Опубликован",
  failed: "Ошибка выкладки", trash: "Мусор", rejected: "Переписываю", draft: "В работе", review: "В работе" };
const STAGE = { "охват": "Охват", "доверие": "Доверие", "продажа": "Продажа" };
const FORMAT = { text: "Текст", image: "Картинка", carousel: "Карусель" };
const SCORE = [["facts", "Факты"], ["strategy", "Стратегия"], ["algo", "Алгоритм"], ["producer", "Продюсер"], ["slop", "Анти-слоп"]];
const TABS = [["pending", "Ждут тебя"], ["reserve", "Резерв"], ["cal", "Календарь"], ["plan", "Запланированы"], ["out", "Опубликовано"], ["today", "Сегодня"], ["trash", "Мусор"], ["all", "Все"]];
const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const NOTE = { ap: "✅ Беру", ed: "✏️ Правки ушли", rw: "❌ Переписываю", tr: "🗑 В мусор", im: "🖼 Ищу другую картинку", pt: "🕒 Меняю время",
  un: "↩️ Снимаю с выкладки", ck: "☑️ Отметил", idea: "💡 Идея ушла" };
// what the post becomes right after a tap, until the Mac answers
const OPT = { ap: "approved", ed: "editing", rw: "rejected", tr: "trash", im: "editing", un: "approved" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 3200); };
const b64d = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
const b64e = (u) => { let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// ---------- crypto + fetch ----------
let CK = null;
async function ckey() { return CK || (CK = await crypto.subtle.importKey("raw", b64d(K), "AES-GCM", false, ["decrypt", "encrypt"])); }
async function open(buf) { const u = new Uint8Array(buf); return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, await ckey(), u.slice(12)); }
async function sealB64(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await ckey(), new TextEncoder().encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12); return b64e(all);
}
let GHT = "", apiOffUntil = 0;
// Alex 21.10 «висит в Загружаю»: a stalled request on a phone network never settled, so every fetch now has a deadline
function tfetch(url, opt, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 8000);
  return fetch(url, Object.assign({}, opt, { signal: c.signal })).finally(() => clearTimeout(t));
}
async function viaApi(path) {  // the API serves a fresh push at once; Pages rebuilds in ~1 min
  if (Date.now() < apiOffUntil) throw new Error("api off");
  const h = { Accept: "application/vnd.github.raw" }; if (GHT) h.Authorization = "Bearer " + GHT;
  const r = await tfetch("https://api.github.com/repos/" + REPO + "/contents/" + path + "?ref=main", { headers: h, cache: "no-store" }, 7000);
  if (r.status === 403 || r.status === 429) apiOffUntil = Date.now() + 10 * 60000;  // rate limit: Pages only for a while
  if (!r.ok) throw new Error(r.status);
  return r.arrayBuffer();
}
async function viaPages(path, fresh) {
  const r = await tfetch(path + (fresh ? "?t=" + Date.now() : ""), { cache: fresh ? "no-store" : "default" }, 10000);
  if (!r.ok) throw new Error(r.status);
  return r.arrayBuffer();
}
async function gunzip(buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(); }
async function freshData() {
  let buf; try { buf = await viaApi("data.gz.bin"); } catch (e) { buf = await viaPages("data.gz.bin", true); }
  return JSON.parse(new TextDecoder().decode(await gunzip(await open(buf))));
}
// images are immutable (named by their hash): kept in the phone's cache after the first load
const IMG = {}, IMGP = {};
async function getBlob(path) {
  let buf = null;
  try { const c = await caches.open("li-img-v1"); const hit = await c.match(path); if (hit) buf = await hit.arrayBuffer(); } catch (e) {}
  if (!buf) {
    try { buf = await viaPages(path, false); } catch (e) { buf = await viaApi(path); }
    try { const c = await caches.open("li-img-v1"); await c.put(path, new Response(buf.slice(0))); } catch (e) {}
  }
  return open(buf);
}
function imgUrl(path, type) {
  if (IMG[path]) return Promise.resolve(IMG[path]);
  return IMGP[path] || (IMGP[path] = getBlob(path).then((b) => (IMG[path] = URL.createObjectURL(new Blob([b], { type: type || "image/png" }))))
    .catch((e) => { delete IMGP[path]; throw e; }));
}
function fillImages(root) {
  (root || document).querySelectorAll("img[data-src]").forEach((im) => {
    const p = im.dataset.src; im.removeAttribute("data-src");
    imgUrl(p).then((u) => { im.src = u; }).catch(() => { im.alt = "картинка не загрузилась"; });
  });
}

// ---------- state ----------
let DATA = null, tab = ls.get("tab", "pending"), cur = null, LOADING = false;
let LANG = ls.get("lang", "en"), OPEN = {}, calMode = ls.get("calMode", "month"), calSel = null;
let PEND = ls.get("pend", {});
const savePend = () => ls.set("pend", PEND);
const pendOf = (p) => { const x = PEND[p.id]; if (!x) return null;
  if (x.st !== p.status || Date.now() - x.t > 20 * 60000) { delete PEND[p.id]; savePend(); return null; } return x; };
const stOf = (p) => { const x = pendOf(p); return x && OPT[x.a] ? OPT[x.a] : p.status; };
const inTab = (p, t) => { const s = stOf(p);
  if (t === "pending") return s === "pending" || s === "failed";
  if (t === "reserve") return s === "reserve";
  if (t === "plan") return s === "scheduled" || s === "approved";
  if (t === "out") return s === "published";
  if (t === "trash") return s === "trash";
  return t === "all"; };
const postText = (p, lang) => { const b = String((lang === "ru" ? p.body_ru : p.body_en) || ""), h = String(p.hook || "").trim();
  if (lang === "ru") return b; return h && !b.trim().startsWith(h) ? h + "\n\n" + b : b; };
const title = (p) => (String(p.hook || p.body_en || p.body_ru || "").trim().split("\n")[0] || p.id).slice(0, 140);

// calendar: month grid of the data's range (past 14 + next 21 days) + the agenda of the slots
function calHtml() {
  const cal = DATA.calendar || [], ps = DATA.posts || [], today = almatyNow().slice(0, 10), nowT = almatyNow().slice(0, 16).replace("T", " ");
  const P = (id) => ps.find((p) => p.id === id), etS = (e) => e.et ? `<br><span style="font-size:11px">${esc(e.et)}</span>` : "";
  const kind = (e) => { if (!e.id) return "free"; const p = P(e.id); if (!p) return "wait"; const s = stOf(p);
    return s === "published" ? "done" : s === "scheduled" || s === "approved" ? "busy" : "wait"; };
  let h = `<div class="cal-h"><span class="lang"><button data-cm="month" class="${calMode === "month" ? "on" : ""}">Месяц</button><button data-cm="list" class="${calMode === "list" ? "on" : ""}">Список</button></span><span class="sp"></span>
    <span class="kv">${cal.filter((e) => !e.id && e.date >= today).length} свободных слотов впереди</span></div>`;
  const slotRow = (e) => { const p = e.id ? P(e.id) : null, past = (e.date + " " + e.slot) < nowT;
    if (!e.id) return `<div class="slot free ${past ? "past" : ""}"><div class="w"><b>${wdOf(e.date)} ${dm(e.date)}</b>${esc(e.slot)}${etS(e)}</div><div class="x">${past ? "Слот прошёл пустым" : "Свободно"}</div></div>`;
    return `<div class="slot ${past ? "past" : ""}" data-open="${esc(e.id)}"><div class="w"><b>${wdOf(e.date)} ${dm(e.date)}</b>${esc(e.slot)}${etS(e)}</div><div class="x"><div class="t">${esc(p ? title(p) : e.id)}</div>
      <div class="kv" style="margin:2px 0 0">${p ? `<span class="chip st-${esc(stOf(p))}">${esc(STATUS[stOf(p)] || "")}</span>` : ""} ${p && p.pillar ? esc(p.pillar.toUpperCase()) : ""}</div></div></div>`; };
  if (calMode === "list") {
    const fut = cal.filter((e) => e.date >= today), past = cal.filter((e) => e.date < today).reverse();
    h += `<div class="sec">Впереди</div>` + (fut.map(slotRow).join("") || `<div class="empty">Слотов нет</div>`);
    if (past.length) h += `<div class="sec">Прошлые 14 дней</div>` + past.map(slotRow).join("");
    return h;
  }
  if (!cal.length) return h + `<div class="empty">Календарь пуст</div>`;
  const d0 = new Date(cal[0].date + "T12:00:00Z"), d1 = new Date(cal[cal.length - 1].date + "T12:00:00Z");
  const first = new Date(Math.min(d0, new Date(today + "T12:00:00Z"))), start = new Date(first); start.setUTCDate(start.getUTCDate() - (start.getUTCDay() + 6) % 7);
  const lastD = new Date(Math.max(d1, new Date(today + "T12:00:00Z"))), end = new Date(lastD); end.setUTCDate(end.getUTCDate() + 6 - (end.getUTCDay() + 6) % 7);
  calSel = calSel || today;
  h += `<div class="grid">${WD.map((w) => `<div class="wd">${w}</div>`).join("")}`;
  for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    const iso = d.toISOString().slice(0, 10), es = cal.filter((e) => e.date === iso);
    const inR = iso >= cal[0].date && iso <= cal[cal.length - 1].date;
    h += `<div class="day ${inR ? "" : "out"} ${iso === today ? "today" : ""} ${iso === calSel ? "sel" : ""}" data-day="${iso}"><span class="d">${+iso.slice(8)}</span>
      ${es.map((e) => `<span class="dot ${kind(e)}" ${e.id ? `data-open="${esc(e.id)}"` : ""}>${e.id ? esc(e.slot) : "своб."}</span>`).join("")}</div>`;
  }
  h += `</div>`;
  const sel = cal.filter((e) => e.date === calSel);
  h += `<div class="sec">${wdOf(calSel)} ${dm(calSel)}</div>` + (sel.length ? sel.map(slotRow).join("") : `<div class="empty" style="padding:16px">В этот день слотов нет</div>`);
  const nf = cal.filter((e) => !e.id && e.date >= today).slice(0, 3);
  if (nf.length) h += `<div class="sec">Ближайшие свободные</div>` + nf.map(slotRow).join("");
  return h;
}

const ckDone = (c) => { const x = PEND["ck:" + c.key]; if (x && (x.st !== String(!!c.done) || Date.now() - x.t > 20 * 60000)) { delete PEND["ck:" + c.key]; savePend(); return !!c.done; }

const safeStart = (s) => String(s).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 60);
function send(a, id, text) {
  const obj = { a, id, text: text || "", t: Date.now() };

  toast(NOTE[a] + (text ? ": текст скопирован, вставь его в чат с ботом" : ""));

  const ck = t.closest("[data-ck]"); if (ck) { if (!PEND["ck:" + ck.dataset.ck]) send("ck", ck.dataset.ck, ""); return; }
  const pdf = t.closest("[data-pdf]"); if (pdf) { e.preventDefault(); toast("Открываю PDF…");
    imgUrl(pdf.dataset.pdf, "application/pdf").then((u) => window.open(u, "_blank") || (location.href = u)).catch(() => toast("PDF не загрузился")); return; }
  const op = t.closest("[data-open]"); if (op) { e.stopPropagation(); return openPost(op.dataset.open); }
  const dy = t.closest("[data-day]"); if (dy) { calSel = dy.dataset.day; return render(); }
  const tb = t.closest(".tab"); if (tb) { tab = tb.dataset.t; ls.set("tab", tab); render(); window.scrollTo(0, 0); }
});
function rerender() { render(); refreshOpen(); }
document.addEventListener("scroll", (e) => {  // carousel page counter
  const c = e.target; if (!c.classList || !c.classList.contains("car")) return;
  const n = c.parentNode.querySelector(".cnt"); if (n) n.textContent = (Math.round(c.scrollLeft / c.clientWidth) + 1) + " / " + c.children.length;
}, true);
$("#back").onclick = closePost;
if (TG) try { TG.BackButton.onClick(closePost); } catch (e) {}
$("#rf").onclick = async () => { $("#rf").textContent = "…"; try { await load(); toast("Обновлено"); } finally { $("#rf").textContent = "⟳"; } };

// ---------- load ----------
async function load() {
  if (!K) { $("#list").innerHTML = '<div id="lock">Открой ссылку из бота: в ней ключ.</div>'; return; }
  if (LOADING && Date.now() - LOADING < 25000) return; LOADING = Date.now();  // a stuck run can't block the next one
  try {
    const prev = DATA, fresh = await freshData();
    DATA = fresh; ls.set("dcache", DATA); applyDicts(); GHT = (DATA.gh && DATA.gh.token) || "";
    $("#upd").innerHTML = '<span class="live"></span>' + esc(DATA.updated || "");
    if (DATA.app_ver && DATA.app_ver !== APP_VER && !sessionStorage.getItem("rl" + DATA.app_ver)) {
      sessionStorage.setItem("rl" + DATA.app_ver, "1");
      location.replace(location.pathname + "?v=" + Date.now() + (qs.get("k") ? "&k=" + encodeURIComponent(K) : "") + (location.hash || "")); return;
    }
    if (prev) { const nw = DATA.posts.filter((p) => p.status === "pending" && !(prev.posts || []).some((o) => o.id === p.id && o.status === "pending"));
      if (nw.length) toast("🆕 Ждут тебя: " + nw.length); }
    render(); refreshOpen();
  } catch (e) {
    if (!DATA && e && e.name === "OperationError") $("#list").innerHTML = '<div id="lock">Неверный ключ: открой ссылку из бота (/app).</div>';
    else if (!DATA) { $("#list").innerHTML = '<div id="lock">Нет связи, пробую ещё раз…</div>'; setTimeout(load, 3000); }
    else $("#upd").innerHTML = "⚠️ нет сети · " + esc(DATA.updated || "");
  } finally { LOADING = false; }
}
function applyDicts() { if (DATA && DATA.pillars && Object.keys(DATA.pillars).length) PILLARS = DATA.pillars; if (DATA && DATA.kinds && Object.keys(DATA.kinds).length) KINDS = DATA.kinds; }
try { const c = ls.get("dcache", null); if (c && K) { DATA = c; applyDicts(); GHT = (DATA.gh && DATA.gh.token) || ""; $("#upd").textContent = "⏳ " + (DATA.updated || ""); render(); } } catch (e) {}
renderTabs();
load().then(() => { const id = qs.get("p"); if (id && DATA) openPost(id); });
setInterval(() => { if (!document.hidden) load(); }, 6000);  // the bot pushes every change within ~3 s
window.addEventListener("online", () => load());
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
